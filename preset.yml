name: 科研绘图模式
description: 面向科研绘图与论文配图的 Agent：整合 16 个科研绘图 Skill——中文可视化顾问与选图、发表级数据图创作与审计、自动出图流水线（FigureAgent）、Nature 级多面板配图、多面板"大纲→拼版→自审"闭环、APA 7.0 配图规范与成图核验、实验数据批量出图出表、figures4papers 风格、数模高级图型模板库、MATLAB/科学计算工具箱、8 套顶会图风格模板与照图复现、AI 生图提示词、GPT Image 生成与编辑、论文框架图 S0–S5 工作流、Visio 可编辑重建、CNS 级出图质检。完整保留标准模式的编码、文件、Shell 与子代理能力，可直接编写并运行 Python/R 绘图脚本、读回成图做视觉自检。
